name: CD Deployment (Vercel)

on:
  push:
    branches: [main, master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------
  # Deploy Backend to Vercel (ideanest-gamma)
  # ---------------------------------------------
  deploy-backend:
    name: Deploy Backend to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy API to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_API }}
          working-directory: ./api
          vercel-args: '--prod'

  # ---------------------------------------------
  # Deploy Frontend to Vercel (idea-nest-eight)
  # ---------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [deploy-backend] # Ensure backend deploys before frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Web to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          working-directory: ./web
          vercel-args: '--prod'
